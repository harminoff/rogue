name: Release Builds

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create or update a GitHub Release"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      release_tag:
        description: "Release tag to publish when create_release is true"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows package
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ncurses
            mingw-w64-x86_64-allegro

      - name: Add MinGW tools to PATH
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install MSYS2 package dependencies
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed `
            mingw-w64-x86_64-gcc `
            mingw-w64-x86_64-make `
            mingw-w64-x86_64-pkgconf `
            mingw-w64-x86_64-ncurses `
            mingw-w64-x86_64-allegro
          Get-ChildItem C:\msys64\mingw64\bin -Filter "*pthread*" -ErrorAction SilentlyContinue | Select-Object FullName
          Get-ChildItem C:\msys64\mingw64\lib -Filter "*curses*" -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packaging tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Validate RL Tiles mapping
        run: powershell -ExecutionPolicy Bypass -File scripts\validate-rltiles.ps1

      - name: Run Python tests
        run: |
          python tests\test_combat_damage_log.py
          python tests\test_tilepack_writer.py
          python tests\test_tile_picker_packaged.py
          python tests\test_tile_picker_generation.py

      - name: Build tile picker executable
        run: powershell -ExecutionPolicy Bypass -File scripts\build-tile-picker-exe.ps1

      - name: Build and package RogueTiles
        run: powershell -ExecutionPolicy Bypass -File scripts\package-windows.ps1 -Zip

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: RogueTiles-windows-x64
          path: dist\RogueTiles-windows-x64.zip
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Validate bundled Allegro artifacts
        shell: pwsh
        run: ./scripts/check-android-allegro.ps1

      - name: Sync Android assets
        shell: pwsh
        run: ./scripts/sync-android-assets.ps1

      - name: Build Android debug APK
        working-directory: android
        run: bash ./gradlew :app:assembleDebug --no-daemon

      - name: Prepare Android artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item android/app/build/outputs/apk/debug/app-debug.apk dist/RogueTiles-android-debug.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RogueTiles-android-debug
          path: dist/RogueTiles-android-debug.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-android
    if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v5
        with:
          name: RogueTiles-windows-x64
          path: dist

      - name: Download Android package
        uses: actions/download-artifact@v5
        with:
          name: RogueTiles-android-debug
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            if ("${{ inputs.release_tag }}" -eq "") {
              throw "release_tag is required when create_release is true."
            }
            $tag = "${{ inputs.release_tag }}"
          }
          $notes = @"
          RogueTiles desktop and Android builds.

          Download RogueTiles-windows-x64.zip, extract it, and run RogueTiles.exe.
          Download RogueTiles-android-debug.apk to install the touch-control Android build.
          TilePicker.exe is included for custom tile set editing.

          Added in this release:
          - Super-Rogue 9.0.1 selectable from the startup game picker, with tile rendering, extended HUD stats, GUI menus, and bundled guide text.
          - Improved F1 manuals/guides with a taller reader, chapter select, and cleaner Super-Rogue guide formatting.
          - Expanded tile picker/runtime tile pack support for variant-specific monster mappings and multiple custom tile sets.
          - Tile frontend polish for wide maps, hidden-object visibility, actor fallbacks, shaders, blood layering, fullscreen/zoom, and packaged runtime assets.
          "@
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            $releaseArgs = @(
              "release", "create", $tag,
              "dist/RogueTiles-windows-x64.zip",
              "dist/RogueTiles-android-debug.apk",
              "--target", "${{ github.sha }}",
              "--title", "RogueTiles $tag",
              "--notes", $notes
            )
            if ($tag -match "-") {
              $releaseArgs += "--prerelease"
            }
            gh @releaseArgs
          }
          else {
            gh release upload $tag `
              dist/RogueTiles-windows-x64.zip `
              dist/RogueTiles-android-debug.apk `
              --clobber
          }
